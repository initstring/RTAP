services:
  rtap-postgres:
    image: postgres:16-alpine
    container_name: rtap-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - rtap-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  rtap-web:
    image: ghcr.io/initstring/rtap:v0.5.0
    container_name: rtap-web
    depends_on:
      - rtap-postgres
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      ENABLE_DEMO_MODE: ${ENABLE_DEMO_MODE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID}
      OKTA_CLIENT_SECRET: ${OKTA_CLIENT_SECRET}
      OKTA_ISSUER: ${OKTA_ISSUER}
    ports:
      - "3000:3000"
    restart: unless-stopped

# If you need TLS, place your own reverse proxy (e.g., Traefik, Caddy, Nginx)
# in front of rtap-web and forward port 80/443 to 3000.

volumes:
  rtap-postgres-data:
    name: rtap-postgres-data
